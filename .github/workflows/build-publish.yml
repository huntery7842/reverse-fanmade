name: Build and publish artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to create or update on the Releases page
        required: true
        type: string
      release_name:
        description: Display name for a new release
        required: false
        default: ReVerse packages
        type: string
      prerelease:
        description: Mark a new release as a pre-release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build backend/ReVerse.Capture.csproj --configuration Release

      - name: Build backend provider tests
        run: dotnet build provider-tests/Provider.Tests.csproj --configuration Release

      - name: Build signaling tests
        run: dotnet build signaling-tests/Signaling.Tests.csproj --configuration Release

      - name: Build DTLS tests
        run: dotnet build dtls-tests/Dtls.Tests.csproj --configuration Release

      - name: Build relay tests
        run: dotnet build player-relay/Relay.Tests/Relay.Tests.csproj --configuration Release

      - name: Build desktop relay
        run: dotnet build player-relay/Relay.Avalonia/Relay.Avalonia.csproj --configuration Release

      - name: Build desktop relay checks
        run: dotnet build player-relay/Relay.Avalonia.Checks/Relay.Avalonia.Checks.csproj --configuration Release

      - name: Run provider tests
        run: dotnet run --project provider-tests/Provider.Tests.csproj --configuration Release --no-build

      - name: Run signaling tests
        run: dotnet run --project signaling-tests/Signaling.Tests.csproj --configuration Release --no-build

      - name: Run desktop relay checks
        run: dotnet run --project player-relay/Relay.Avalonia.Checks/Relay.Avalonia.Checks.csproj --configuration Release --no-build

      - name: Publish backend
        run: dotnet publish backend/ReVerse.Capture.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/backend

      - name: Publish Windows relay
        run: dotnet publish player-relay/Relay.Avalonia/Relay.Avalonia.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/relay

      - name: Package artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/backend/* -DestinationPath artifacts/ReVerse-backend-win-x64.zip
          Compress-Archive -Path artifacts/relay/* -DestinationPath artifacts/ReVerseRelay-win-x64.zip

      - name: Upload backend package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ReVerse-backend-win-x64
          path: artifacts/ReVerse-backend-win-x64.zip
          archive: false
          if-no-files-found: error

      - name: Upload relay package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ReVerseRelay-win-x64
          path: artifacts/ReVerseRelay-win-x64.zip
          archive: false
          if-no-files-found: error

  publish-linux-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish Linux backend
        run: dotnet publish backend/ReVerse.Capture.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/backend

      - name: Package Linux backend
        run: |
          chmod +x artifacts/backend/ReVerse.Capture
          cd artifacts/backend
          zip -r ../ReVerse-backend-linux-x64.zip .

      - name: Upload Linux backend package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ReVerse-backend-linux-x64
          path: artifacts/ReVerse-backend-linux-x64.zip
          archive: false
          if-no-files-found: error

      - name: Publish Linux relay
        run: dotnet publish player-relay/Relay.Avalonia/Relay.Avalonia.csproj --configuration Release --runtime linux-x64 --self-contained true --output artifacts/relay

      - name: Package Linux relay
        run: |
          chmod +x artifacts/relay/Relay.Avalonia
          cd artifacts/relay
          zip -r ../ReVerseRelay-linux-x64.zip .

      - name: Upload Linux relay package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ReVerseRelay-linux-x64
          path: artifacts/ReVerseRelay-linux-x64.zip
          archive: false
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs:
      - build-test-publish
      - publish-linux-artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7.0.1
        with:
          pattern: ReVerse*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            echo "Expected four package ZIPs, found ${#assets[@]}." >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            create_args=("$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_NAME" --generate-notes)
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

          echo "Release URL:"
          gh release view "$RELEASE_TAG" --json url --jq .url
